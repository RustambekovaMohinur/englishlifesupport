services:
  - type: web
    name: english-life-lms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ASYNC_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: BOOTSTRAP_TEACHER_EMAIL
        sync: false
      - key: BOOTSTRAP_TEACHER_PASSWORD
        sync: false
      - key: BOOTSTRAP_TEACHER_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
