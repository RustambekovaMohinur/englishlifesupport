services:
  - type: web
    name: english-life-lms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ASYNC_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BOOTSTRAP_TEACHER_EMAIL
        sync: false
      - key: BOOTSTRAP_TEACHER_PASSWORD
        sync: false
      - key: BOOTSTRAP_TEACHER_NAME
        sync: false
      - key: CORS_ORIGINS
        value: https://englishlifesupport.vercel.app,http://localhost:5173
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: b2
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_BUCKET_NAME
        value: english-life-files
      - key: B2_REGION
        value: us-east-005
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
